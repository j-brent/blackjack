<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <script>
        // Stamp the saved theme before first paint so the page never flashes
        // the default palette. Kept inline and dependency-free on purpose.
        (function () {
            var THEMES = ['noir-club', 'midnight-tuxedo', 'champagne-playbill', 'monte-carlo-gold'];
            var saved;
            try { saved = localStorage.getItem('bj-theme'); } catch (e) { saved = null; }
            document.documentElement.dataset.theme =
                THEMES.indexOf(saved) === -1 ? THEMES[0] : saved;
        })();
    </script>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
</head>
<body>
    <noscript>
        <div class="noscript-message">
            JavaScript is required to play this game. Please enable JavaScript in your browser.
        </div>
    </noscript>

    <div id="loading-state" class="loading-container">
        <div class="loading-spinner"></div>
        <p>Loading game...</p>
    </div>

    <div id="error-state" class="error-container" style="display: none;">
        <p class="error-message">Failed to load game. Please refresh the page.</p>
        <button id="reload-button" class="btn-reload">Reload</button>
    </div>

    <div id="game-container" style="display: none;">
        <div id="theme-picker">
            <button id="theme-button" type="button" aria-haspopup="true" aria-expanded="false"
                    aria-controls="theme-menu" title="Change design" aria-label="Change design">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 3a9 9 0 1 0 0 18 2.5 2.5 0 0 0 2.5-2.5c0-.66-.26-1.26-.68-1.7a2.5 2.5 0 0 1 1.8-4.3H17A4 4 0 0 0 21 8.5C21 5.46 16.97 3 12 3Z"/>
                    <circle cx="7.5" cy="11" r="1.4"/>
                    <circle cx="10.5" cy="7" r="1.4"/>
                    <circle cx="15" cy="7.5" r="1.4"/>
                </svg>
            </button>
            <div id="theme-menu" role="menu" aria-label="Design" hidden>
                <button type="button" role="menuitemradio" data-theme="noir-club" aria-checked="false">Noir Club</button>
                <button type="button" role="menuitemradio" data-theme="midnight-tuxedo" aria-checked="false">Midnight Tuxedo</button>
                <button type="button" role="menuitemradio" data-theme="champagne-playbill" aria-checked="false">Champagne Playbill</button>
                <button type="button" role="menuitemradio" data-theme="monte-carlo-gold" aria-checked="false">Monte Carlo Gold</button>
            </div>
        </div>

        <!-- Side rail: used by midnight-tuxedo, hidden by the other themes.
             Text comes from CSS content since it is purely decorative. -->
        <aside id="rail" aria-hidden="true">
            <span class="rail-kicker"></span>
            <div class="rail-foot">
                <p class="rail-mark"></p>
                <p class="rail-status"></p>
            </div>
        </aside>

        <div id="stage">
            <header id="header">
                <span class="kicker" aria-hidden="true"></span>
                <h1>Blackjack</h1>
                <div class="header-rule" aria-hidden="true"></div>
            </header>

            <main>
                <div id="frame">
                    <div id="seats">
                        <section id="dealer-area" aria-labelledby="dealer-label">
                            <h2 id="dealer-label">Dealer</h2>
                            <div id="dealer-cards" class="card-container"></div>
                            <p id="dealer-value" class="value" aria-live="polite"></p>
                        </section>

                        <div class="seat-divider" aria-hidden="true"><span></span></div>

                        <section id="player-area" aria-labelledby="player-label">
                            <h2 id="player-label">Your Hand</h2>
                            <div id="player-cards" class="card-container"></div>
                            <p id="player-value" class="value" aria-live="polite"></p>
                        </section>

                        <section id="player-area-split" class="split-layout" style="display: none;">
                            <div class="hand-container" data-hand="0">
                                <h3>Hand 1</h3>
                                <div class="card-container"></div>
                                <p class="value" aria-live="polite"></p>
                            </div>
                            <div class="hand-container" data-hand="1">
                                <h3>Hand 2</h3>
                                <div class="card-container"></div>
                                <p class="value" aria-live="polite"></p>
                            </div>
                        </section>
                    </div>
                </div>

                <div id="actions">
                    <button id="btn-hit" hidden data-action="hit">Hit (H)</button>
                    <button id="btn-stand" hidden data-action="stand">Stand (S)</button>
                    <button id="btn-split" hidden data-action="split">Split (P)</button>
                    <button id="btn-new-game" hidden data-action="new-game">New Game (N)</button>
                </div>
            </main>

            <footer id="status-bar">
                <p id="status-message" role="status" aria-live="polite"></p>
                <span class="hint" aria-hidden="true"></span>
            </footer>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
