<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack — Midnight Tuxedo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(14% 0.006 50);
    --surface: oklch(18% 0.007 50);
    --fg: oklch(95% 0.008 80);
    --muted: oklch(64% 0.012 70);
    --border: oklch(30% 0.008 60);
    --accent: oklch(80% 0.02 90);
    --accent-hover: oklch(72% 0.02 90);
    --accent-ink: oklch(14% 0.006 50);
    --card-face: oklch(95% 0.008 80);
    --card-ink: oklch(18% 0.006 50);
    --card-red: oklch(53% 0.2 27);
    --font-display: 'Frank Ruhl Libre', Georgia, serif;
    --font-body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    min-height: 100dvh;
    line-height: 1.5;
  }
  .stage{
    max-width: 58rem;
    margin: 0 auto;
    min-height: 100dvh;
    display:grid;
    grid-template-columns: 12rem 1fr;
  }
  .rail{
    border-right: 1px solid var(--border);
    padding: 3rem 1.5rem 2rem;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .rail-top .kicker{
    display:block;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 auto;
  }
  .rail-mark{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.07em;
  }
  .rail-status{
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  main{
    padding: 3.5rem 3rem 3rem;
    display:flex;
    flex-direction:column;
    gap: 2.25rem;
  }
  h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 3.4rem;
    letter-spacing: -0.02em;
    line-height: 1.0;
    margin-bottom: 0.25rem;
  }
  .dossier-line{
    display:flex;
    align-items:center;
    gap: 0.75rem;
  }
  .dossier-line .line{ flex:1; height: 1px; background: var(--border); }
  .dossier-line span{
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seats{ display:flex; flex-direction:column; gap: 2rem; }
  .seat{ display:flex; align-items:flex-end; gap: 1.75rem; }
  .seat-label{
    width: 6.5rem;
    flex-shrink: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--muted);
    padding-bottom: 0.4rem;
  }
  .cards{ display:flex; }
  .card{ width: 5.3rem; height: 7.4rem; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5)); }
  .card:not(:first-child){ margin-left: -2.2rem; }
  .card-bg{ fill: var(--card-face); }
  .card.red text{ fill: var(--card-red); }
  .card.black text{ fill: var(--card-ink); }
  .card-rank-top, .card-suit-top, .card-rank-bottom, .card-suit-bottom{
    font-family: var(--font-display); font-weight: 600;
  }
  .card.face-down .card-bg{ fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
  .card-back-mark{ fill: var(--accent); font-family: var(--font-display); }
  .hand-value{
    margin-left: auto;
    font-size: 1rem;
    font-weight: 600;
    align-self: center;
  }
  .hand-value .soft{ color: var(--muted); font-weight: 400; }
  #actions{ display:flex; gap: 0.85rem; margin-top: 0.5rem; }
  button{
    min-width: 6.5rem; height: 2.75rem;
    font-family: var(--font-body); font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 1px; cursor:pointer;
    transition: background-color 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
  }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
  .btn-primary:hover{ background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-secondary{ background: transparent; color: var(--fg); border: 1px solid var(--border); }
  .btn-secondary:hover{ border-color: var(--fg); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  button:active{ transform: translateY(1px); }
  footer{
    margin-top: auto;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  #status-message{ font-size: 0.85rem; color: var(--fg); }
  .hint{ font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; }
  @media (max-width: 40rem){
    .stage{ grid-template-columns: 1fr; }
    .rail{ flex-direction:row; border-right:none; border-bottom:1px solid var(--border); padding: 1.25rem 1.5rem; }
    .rail-top .kicker{ writing-mode: horizontal-tb; margin:0; }
    main{ padding: 2rem 1.5rem; }
    h1{ font-size: 2.4rem; }
    .seat{ flex-wrap: wrap; }
    .hand-value{ margin-left: 0; width:100%; }
  }
</style>
</head>
<body>
<div class="stage" data-od-id="table-panel">
  <aside class="rail" data-od-id="rail">
    <div class="rail-top">
      <span class="kicker">Table VII — Private</span>
    </div>
    <div>
      <p class="rail-mark">B.J.</p>
      <p class="rail-status">In Play</p>
    </div>
  </aside>
  <main>
    <header data-od-id="header">
      <h1>Blackjack</h1>
      <div class="dossier-line"><span>Dossier</span><span class="line"></span><span>No. 07</span></div>
    </header>

    <div class="seats">
      <section class="seat" data-od-id="dealer-area" aria-labelledby="dealer-label">
        <p class="seat-label" id="dealer-label">Dealer</p>
        <div class="cards">
          <svg class="card face-down" viewBox="0 0 250 350" role="img" aria-label="Hole card hidden">
            <rect class="card-bg" width="250" height="350" rx="8"/>
            <text class="card-back-mark" x="125" y="190" font-size="58" text-anchor="middle">♣</text>
          </svg>
          <svg class="card black" viewBox="0 0 250 350" role="img" aria-label="Queen of Spades">
            <rect class="card-bg" width="250" height="350" rx="8"/>
            <text class="card-rank-top" x="20" y="60" font-size="48">Q</text>
            <text class="card-suit-top" x="20" y="106" font-size="40">♠</text>
            <text class="card-suit-center" x="125" y="185" font-size="96" text-anchor="middle" dominant-baseline="central">♠</text>
            <text class="card-rank-bottom" x="20" y="60" font-size="48" transform="rotate(180,125,175)">Q</text>
            <text class="card-suit-bottom" x="20" y="106" font-size="40" transform="rotate(180,125,175)">♠</text>
          </svg>
        </div>
        <p class="hand-value" id="dealer-value">Showing: 10</p>
      </section>

      <section class="seat" data-od-id="player-area" aria-labelledby="player-label">
        <p class="seat-label" id="player-label">Your Hand</p>
        <div class="cards">
          <svg class="card red" viewBox="0 0 250 350" role="img" aria-label="Ace of Hearts">
            <rect class="card-bg" width="250" height="350" rx="8"/>
            <text class="card-rank-top" x="20" y="60" font-size="48">A</text>
            <text class="card-suit-top" x="20" y="106" font-size="40">♥</text>
            <text class="card-suit-center" x="125" y="185" font-size="96" text-anchor="middle" dominant-baseline="central">♥</text>
            <text class="card-rank-bottom" x="20" y="60" font-size="48" transform="rotate(180,125,175)">A</text>
            <text class="card-suit-bottom" x="20" y="106" font-size="40" transform="rotate(180,125,175)">♥</text>
          </svg>
          <svg class="card black" viewBox="0 0 250 350" role="img" aria-label="Seven of Clubs">
            <rect class="card-bg" width="250" height="350" rx="8"/>
            <text class="card-rank-top" x="20" y="60" font-size="48">7</text>
            <text class="card-suit-top" x="20" y="106" font-size="40">♣</text>
            <text class="card-suit-center" x="125" y="185" font-size="96" text-anchor="middle" dominant-baseline="central">♣</text>
            <text class="card-rank-bottom" x="20" y="60" font-size="48" transform="rotate(180,125,175)">7</text>
            <text class="card-suit-bottom" x="20" y="106" font-size="40" transform="rotate(180,125,175)">♣</text>
          </svg>
        </div>
        <p class="hand-value" id="player-value">Value: 18 <span class="soft">(soft)</span></p>
      </section>
    </div>

    <div id="actions" data-od-id="actions">
      <button class="btn-primary" data-od-id="btn-hit">Hit</button>
      <button class="btn-secondary" data-od-id="btn-stand">Stand</button>
    </div>

    <footer data-od-id="status-bar">
      <p id="status-message">Your turn</p>
      <span class="hint">H · HIT&nbsp;&nbsp;&nbsp;S · STAND</span>
    </footer>
  </main>
</div>
</body>
</html>
