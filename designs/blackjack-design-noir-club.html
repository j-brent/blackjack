<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack — Noir Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(16% 0.004 60);
    --surface: oklch(20% 0.006 60);
    --fg: oklch(94% 0.01 80);
    --muted: oklch(66% 0.018 75);
    --border: oklch(31% 0.012 65);
    --accent: oklch(74% 0.09 83);
    --accent-hover: oklch(66% 0.09 83);
    --accent-ink: oklch(15% 0.01 60);
    --danger: oklch(62% 0.16 25);
    --success: oklch(68% 0.11 155);
    --card-face: oklch(95% 0.012 80);
    --card-ink: oklch(18% 0.006 60);
    --card-red: oklch(48% 0.16 25);
    --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-weight: 400;
    min-height: 100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 2.5rem 1.25rem;
    line-height: 1.5;
  }
  .table-panel{
    width: 100%;
    max-width: 30rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  header{
    text-align:center;
    padding: 2.25rem 2rem 1.5rem;
  }
  .kicker{
    display:block;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 0.85rem;
  }
  h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 2.5rem;
    letter-spacing: -0.01em;
    line-height: 1.05;
  }
  .rule{
    height: 1px;
    margin: 0 2rem;
    background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
  }
  main{
    padding: 1.75rem 2rem 0.5rem;
    display:flex;
    flex-direction:column;
    gap: 1.5rem;
  }
  .seat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 0.6rem;
  }
  .seat-label{
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .cards{
    display:flex;
    justify-content:center;
  }
  .card{
    width: 4.5rem;
    height: 6.3rem;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45));
  }
  .card:not(:first-child){ margin-left: -1.9rem; }
  .card-bg{ fill: var(--card-face); }
  .card.red text{ fill: var(--card-red); }
  .card.black text{ fill: var(--card-ink); }
  .card-rank-top, .card-suit-top, .card-rank-bottom, .card-suit-bottom{
    font-family: var(--font-display);
    font-weight: 600;
  }
  .card.face-down .card-bg{ fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
  .card-back-mark{ fill: var(--accent); font-family: var(--font-display); font-weight: 600; }
  .hand-value{
    font-size: 0.9rem;
    color: var(--fg);
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .hand-value .soft{ color: var(--muted); font-weight: 400; }
  .divider{
    display:flex;
    align-items:center;
    gap: 0.75rem;
    color: var(--border);
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--border);
  }
  .divider span{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #actions{
    display:flex;
    justify-content:center;
    gap: 0.75rem;
    padding: 1.75rem 2rem;
  }
  button{
    min-width: 8rem;
    height: 2.9rem;
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    transition: background-color 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
  }
  .btn-primary{
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid var(--accent);
  }
  .btn-primary:hover{ background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-secondary{
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover{ border-color: var(--fg); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  button:active{ transform: translateY(1px); }
  footer{
    padding: 1rem 2rem 1.75rem;
    text-align:center;
    border-top: 1px solid var(--border);
    margin-top: 0.25rem;
  }
  #status-message{
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .hint{
    display:block;
    margin-top: 0.35rem;
    font-size: 0.7rem;
    color: var(--border);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="table-panel" data-od-id="table-panel">
  <header data-od-id="header">
    <span class="kicker">Private Table — No. VII</span>
    <h1>Blackjack</h1>
  </header>
  <div class="rule"></div>
  <main>
    <section class="seat" data-od-id="dealer-area" aria-labelledby="dealer-label">
      <p class="seat-label" id="dealer-label">Dealer</p>
      <div class="cards">
        <svg class="card face-down" viewBox="0 0 250 350" role="img" aria-label="Hole card hidden">
          <rect class="card-bg" width="250" height="350" rx="10"/>
          <text class="card-back-mark" x="125" y="190" font-size="64" text-anchor="middle">♠</text>
        </svg>
        <svg class="card black" viewBox="0 0 250 350" role="img" aria-label="Queen of Spades">
          <rect class="card-bg" width="250" height="350" rx="10"/>
          <text class="card-rank-top" x="20" y="62" font-size="50">Q</text>
          <text class="card-suit-top" x="20" y="108" font-size="42">♠</text>
          <text class="card-suit-center" x="125" y="185" font-size="100" text-anchor="middle" dominant-baseline="central">♠</text>
          <text class="card-rank-bottom" x="20" y="62" font-size="50" transform="rotate(180,125,175)">Q</text>
          <text class="card-suit-bottom" x="20" y="108" font-size="42" transform="rotate(180,125,175)">♠</text>
        </svg>
      </div>
      <p class="hand-value" id="dealer-value">Showing: 10</p>
    </section>

    <div class="divider"><span>vs</span></div>

    <section class="seat" data-od-id="player-area" aria-labelledby="player-label">
      <p class="seat-label" id="player-label">Your Hand</p>
      <div class="cards">
        <svg class="card red" viewBox="0 0 250 350" role="img" aria-label="Ace of Hearts">
          <rect class="card-bg" width="250" height="350" rx="10"/>
          <text class="card-rank-top" x="20" y="62" font-size="50">A</text>
          <text class="card-suit-top" x="20" y="108" font-size="42">♥</text>
          <text class="card-suit-center" x="125" y="185" font-size="100" text-anchor="middle" dominant-baseline="central">♥</text>
          <text class="card-rank-bottom" x="20" y="62" font-size="50" transform="rotate(180,125,175)">A</text>
          <text class="card-suit-bottom" x="20" y="108" font-size="42" transform="rotate(180,125,175)">♥</text>
        </svg>
        <svg class="card black" viewBox="0 0 250 350" role="img" aria-label="Seven of Clubs">
          <rect class="card-bg" width="250" height="350" rx="10"/>
          <text class="card-rank-top" x="20" y="62" font-size="50">7</text>
          <text class="card-suit-top" x="20" y="108" font-size="42">♣</text>
          <text class="card-suit-center" x="125" y="185" font-size="100" text-anchor="middle" dominant-baseline="central">♣</text>
          <text class="card-rank-bottom" x="20" y="62" font-size="50" transform="rotate(180,125,175)">7</text>
          <text class="card-suit-bottom" x="20" y="108" font-size="42" transform="rotate(180,125,175)">♣</text>
        </svg>
      </div>
      <p class="hand-value" id="player-value">Value: 18 <span class="soft">(soft)</span></p>
    </section>
  </main>

  <div id="actions" data-od-id="actions">
    <button class="btn-primary" data-od-id="btn-hit">Hit</button>
    <button class="btn-secondary" data-od-id="btn-stand">Stand</button>
  </div>

  <footer data-od-id="status-bar">
    <p id="status-message">Your turn</p>
    <span class="hint">H · Hit &nbsp; S · Stand</span>
  </footer>
</div>
</body>
</html>
