<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack — Champagne Playbill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(15% 0.01 70);
    --surface: oklch(19% 0.012 70);
    --fg: oklch(94% 0.012 85);
    --muted: oklch(62% 0.02 75);
    --border: oklch(30% 0.015 70);
    --accent: oklch(83% 0.06 85);
    --accent-hover: oklch(75% 0.06 85);
    --accent-ink: oklch(15% 0.01 70);
    --card-face: oklch(94% 0.014 85);
    --card-ink: oklch(19% 0.01 70);
    --card-red: oklch(54% 0.2 27);
    --font-display: 'EB Garamond', Georgia, serif;
    --font-body: 'Jost', 'Segoe UI', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    min-height: 100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 2.5rem 1.25rem;
    line-height: 1.5;
  }
  .program{ width: 100%; max-width: 40rem; }
  header{ text-align:center; margin-bottom: 2rem; }
  .kicker{
    display:block;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.85rem;
  }
  h1{
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 3rem;
    letter-spacing: -0.005em;
  }
  .columns{
    display:grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 2.25rem;
    align-items: stretch;
  }
  .rule-v{ background: var(--accent); }
  .seat{ display:flex; flex-direction:column; align-items:center; gap: 1.1rem; padding: 0.5rem 0; }
  .seat-label{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.15rem;
    color: var(--muted);
  }
  .cards{ display:flex; justify-content:center; }
  .card{ width: 4.3rem; height: 6rem; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)); }
  .card:not(:first-child){ margin-left: -1.8rem; }
  .card-bg{ fill: var(--card-face); }
  .card.red text{ fill: var(--card-red); }
  .card.black text{ fill: var(--card-ink); }
  .card-rank-top, .card-suit-top, .card-rank-bottom, .card-suit-bottom{
    font-family: var(--font-display); font-weight: 600;
  }
  .card.face-down .card-bg{ fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
  .card-back-mark{ fill: var(--accent); font-family: var(--font-display); font-style: italic; }
  .hand-value{ font-size: 0.88rem; font-weight: 500; }
  .hand-value .soft{ color: var(--muted); }
  #actions{ display:flex; justify-content:center; gap: 0.75rem; margin-top: 2.25rem; }
  button{
    min-width: 8rem; height: 2.85rem;
    font-family: var(--font-body); font-size: 0.82rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 1px; cursor:pointer;
    transition: background-color 160ms ease-out, border-color 160ms ease-out, color 160ms ease-out;
  }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
  .btn-primary:hover{ background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-secondary{ background: transparent; color: var(--fg); border: 1px solid var(--border); }
  .btn-secondary:hover{ border-color: var(--fg); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  button:active{ transform: translateY(1px); }
  footer{ text-align:center; margin-top: 1.75rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  #status-message{ font-size: 0.85rem; color: var(--muted); }
  .hint{ display:block; margin-top: 0.3rem; font-size: 0.68rem; color: var(--border); letter-spacing: 0.08em; }
  @media (max-width: 32rem){
    .columns{ grid-template-columns: 1fr; }
    .rule-v{ display:none; }
    .seat{ padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
    .seat:last-child{ border-bottom:none; }
  }
</style>
</head>
<body>
<div class="program" data-od-id="table-panel">
  <header data-od-id="header">
    <span class="kicker">An Evening At The Table</span>
    <h1>Blackjack</h1>
  </header>

  <div class="columns">
    <section class="seat" data-od-id="dealer-area" aria-labelledby="dealer-label">
      <p class="seat-label" id="dealer-label">Dealer</p>
      <div class="cards">
        <svg class="card face-down" viewBox="0 0 250 350" role="img" aria-label="Hole card hidden">
          <rect class="card-bg" width="250" height="350" rx="8"/>
          <text class="card-back-mark" x="125" y="192" font-size="56" text-anchor="middle">♦</text>
        </svg>
        <svg class="card black" viewBox="0 0 250 350" role="img" aria-label="Queen of Spades">
          <rect class="card-bg" width="250" height="350" rx="8"/>
          <text class="card-rank-top" x="20" y="60" font-size="48">Q</text>
          <text class="card-suit-top" x="20" y="106" font-size="40">♠</text>
          <text class="card-suit-center" x="125" y="185" font-size="96" text-anchor="middle" dominant-baseline="central">♠</text>
          <text class="card-rank-bottom" x="20" y="60" font-size="48" transform="rotate(180,125,175)">Q</text>
          <text class="card-suit-bottom" x="20" y="106" font-size="40" transform="rotate(180,125,175)">♠</text>
        </svg>
      </div>
      <p class="hand-value" id="dealer-value">Showing: 10</p>
    </section>

    <div class="rule-v"></div>

    <section class="seat" data-od-id="player-area" aria-labelledby="player-label">
      <p class="seat-label" id="player-label">Your Hand</p>
      <div class="cards">
        <svg class="card red" viewBox="0 0 250 350" role="img" aria-label="Ace of Hearts">
          <rect class="card-bg" width="250" height="350" rx="8"/>
          <text class="card-rank-top" x="20" y="60" font-size="48">A</text>
          <text class="card-suit-top" x="20" y="106" font-size="40">♥</text>
          <text class="card-suit-center" x="125" y="185" font-size="96" text-anchor="middle" dominant-baseline="central">♥</text>
          <text class="card-rank-bottom" x="20" y="60" font-size="48" transform="rotate(180,125,175)">A</text>
          <text class="card-suit-bottom" x="20" y="106" font-size="40" transform="rotate(180,125,175)">♥</text>
        </svg>
        <svg class="card black" viewBox="0 0 250 350" role="img" aria-label="Seven of Clubs">
          <rect class="card-bg" width="250" height="350" rx="8"/>
          <text class="card-rank-top" x="20" y="60" font-size="48">7</text>
          <text class="card-suit-top" x="20" y="106" font-size="40">♣</text>
          <text class="card-suit-center" x="125" y="185" font-size="96" text-anchor="middle" dominant-baseline="central">♣</text>
          <text class="card-rank-bottom" x="20" y="60" font-size="48" transform="rotate(180,125,175)">7</text>
          <text class="card-suit-bottom" x="20" y="106" font-size="40" transform="rotate(180,125,175)">♣</text>
        </svg>
      </div>
      <p class="hand-value" id="player-value">Value: 18 <span class="soft">(soft)</span></p>
    </section>
  </div>

  <div id="actions" data-od-id="actions">
    <button class="btn-primary" data-od-id="btn-hit">Hit</button>
    <button class="btn-secondary" data-od-id="btn-stand">Stand</button>
  </div>

  <footer data-od-id="status-bar">
    <p id="status-message">Your turn</p>
    <span class="hint">H · HIT&nbsp;&nbsp;&nbsp;S · STAND</span>
  </footer>
</div>
</body>
</html>
